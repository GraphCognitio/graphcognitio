app:
  embeddings:
    provider: ${APP_EMBEDDINGS_PROVIDER:hashing}
    model: ${APP_EMBEDDINGS_MODEL:semantic-hash-v3}
    dimensions: ${APP_EMBEDDINGS_DIMENSIONS:192}
  security:
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
    public-observability:
      enabled: ${APP_PUBLIC_OBSERVABILITY_ENABLED:true}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
