app:
  embeddings:
    provider: ${APP_EMBEDDINGS_PROVIDER:openai}
    model: ${APP_EMBEDDINGS_MODEL:text-embedding-3-small}
    dimensions: ${APP_EMBEDDINGS_DIMENSIONS:192}
  security:
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
    public-observability:
      enabled: ${APP_PUBLIC_OBSERVABILITY_ENABLED:false}

springdoc:
  api-docs:
    enabled: ${APP_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${APP_SWAGGER_UI_ENABLED:false}
