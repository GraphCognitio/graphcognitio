spring:
  application:
    name: graphcognitio
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/graphcognitio}
    username: ${SPRING_DATASOURCE_USERNAME:graphcognitio}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    placeholders:
      bootstrap_admin_email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
  cache:
    type: caffeine
    cache-names: feedCache,graphCache
    caffeine:
      spec: maximumSize=${APP_CACHE_MAX_SIZE:1000},expireAfterWrite=${APP_CACHE_TTL_SECONDS:30}s,recordStats

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    exp-minutes: ${APP_JWT_EXP_MINUTES:60}
  security:
    public-observability:
      enabled: ${APP_PUBLIC_OBSERVABILITY_ENABLED:false}
    cors:
      allowed-origins:
        - ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    auth-register:
      limit: ${APP_RATE_LIMIT_AUTH_REGISTER_LIMIT:5}
      window-seconds: ${APP_RATE_LIMIT_AUTH_REGISTER_WINDOW_SECONDS:60}
    auth-login:
      limit: ${APP_RATE_LIMIT_AUTH_LOGIN_LIMIT:10}
      window-seconds: ${APP_RATE_LIMIT_AUTH_LOGIN_WINDOW_SECONDS:60}
    create-post:
      limit: ${APP_RATE_LIMIT_CREATE_POST_LIMIT:20}
      window-seconds: ${APP_RATE_LIMIT_CREATE_POST_WINDOW_SECONDS:60}
    create-reply:
      limit: ${APP_RATE_LIMIT_CREATE_REPLY_LIMIT:40}
      window-seconds: ${APP_RATE_LIMIT_CREATE_REPLY_WINDOW_SECONDS:60}
    likes:
      limit: ${APP_RATE_LIMIT_LIKES_LIMIT:120}
      window-seconds: ${APP_RATE_LIMIT_LIKES_WINDOW_SECONDS:60}
  idempotency:
    enabled: ${APP_IDEMPOTENCY_ENABLED:true}
    ttl-minutes: ${APP_IDEMPOTENCY_TTL_MINUTES:120}
  features:
    search-enabled: ${ENABLE_SEARCH:true}
    graph-expand-enabled: ${ENABLE_GRAPH_EXPAND:true}
  embeddings:
    enabled: ${APP_EMBEDDINGS_ENABLED:true}
    provider: ${APP_EMBEDDINGS_PROVIDER:hashing}
    model: ${APP_EMBEDDINGS_MODEL:semantic-hash-v3}
    dimensions: ${APP_EMBEDDINGS_DIMENSIONS:192}
    reindex-batch-size: ${APP_EMBEDDINGS_REINDEX_BATCH_SIZE:200}
    remote:
      base-url: ${APP_EMBEDDINGS_REMOTE_BASE_URL:https://api.openai.com}
      path: ${APP_EMBEDDINGS_REMOTE_PATH:/v1/embeddings}
      api-key: ${APP_EMBEDDINGS_REMOTE_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  structured:
    format:
      console: logstash
