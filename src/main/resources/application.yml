spring:
  application:
    name: graphcognitio
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/graphcognitio}
    username: ${SPRING_DATASOURCE_USERNAME:graphcognitio}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    exp-minutes: ${APP_JWT_EXP_MINUTES:60}
