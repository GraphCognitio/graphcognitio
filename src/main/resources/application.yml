spring:
  application:
    name: graphcognitio
  datasource:
    url: jdbc:postgresql://localhost:5432/graphcognitio
    username: graphcognitio
    password: graphcognitio_dev_password
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    exp-minutes: ${APP_JWT_EXP_MINUTES:60}
