services:
  postgres:
    image: postgres:18
    container_name: graphcognitio-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - graphcognitio_postgres_data:/var/lib/postgresql/data

volumes:
  graphcognitio_postgres_data:
