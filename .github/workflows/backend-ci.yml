name: backend-ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      APP_JWT_EXP_MINUTES: 60
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Generate ephemeral test secret
        run: echo "APP_JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Run tests
        run: ./mvnw test
